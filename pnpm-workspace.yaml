allowBuilds:
  '@alicloud/openapi-core': set this to true or false
  esbuild: true
  sharp: true
  workerd: true
injectWorkspacePackages: true
overrides:
  fast-uri@3: 3.1.5
  nanoid@3: 3.3.17
  postcss@8: 8.5.26
  sharp@0.34: 0.35.3
  ws@8: 8.21.3
packages:
  - "."
  - "apps/*"
  - "packages/*"

syncInjectedDepsAfterScripts:
  - build

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
