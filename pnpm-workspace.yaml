allowBuilds:
  '@alicloud/openapi-core': false
  esbuild: true
  sharp: true
  workerd: true
injectWorkspacePackages: true
overrides:
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9
  fast-uri@3: 3.1.5
  js-yaml@4: 4.3.1
  nanoid@3: 3.3.17
  postcss@8: 8.5.26
  sharp@0.34: 0.35.3
  ws@8: 8.21.3
packages:
  - "."
  - "apps/*"
  - "packages/*"

syncInjectedDepsAfterScripts:
  - build

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
