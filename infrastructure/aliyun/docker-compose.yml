name: topology-scm-v2

services:
  migrator:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    profiles: ["tools"]
    user: "0:0"
    working_dir: /app
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DB_SSL: "${DB_SSL:-disabled}"
      DB_SSL_REJECT_UNAUTHORIZED: "${DB_SSL_REJECT_UNAUTHORIZED:-false}"
    command: ["node", "node_modules/drizzle-kit/bin.cjs", "migrate", "--config", "database/tooling/drizzle.mysql.config.ts"]
    restart: "no"

  bootstrap:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    profiles: ["tools"]
    user: "0:0"
    working_dir: /app
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DB_SSL: "${DB_SSL:-disabled}"
      LOCAL_FIXTURE_RUN_ID: "${LOCAL_FIXTURE_RUN_ID:-uat}"
      LOCAL_FIXTURE_PASSWORD: "${LOCAL_FIXTURE_PASSWORD:?LOCAL_FIXTURE_PASSWORD is required}"
    command: ["node", "infrastructure/local/bootstrap.mjs"]
    restart: "no"

  stub:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    user: "0:0"
    restart: unless-stopped
    command: ["node", "infrastructure/local/stub-provider.mjs"]
    environment:
      HOST: 0.0.0.0
      PORT: "3003"
      LOCAL_STUB_KEYS_JSON: '{"email":"uat-email-key","sms":"uat-sms-key","scan":"uat-scan-key"}'
      LOCAL_STUB_CONTROL_TOKEN: topology-uat-control-token
    expose:
      - "3003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    user: "0:0"
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: local
      DEPLOY_TARGET: local
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: "3001"
      ALLOW_INSECURE_LOCAL_COOKIES: "false"
      LOCAL_FIXED_OTP_CODE: "123456"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      DB_SSL: "${DB_SSL:-disabled}"
      DB_SSL_REJECT_UNAUTHORIZED: "${DB_SSL_REJECT_UNAUTHORIZED:-false}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      WORKER_DB_POOL_SIZE: "${WORKER_DB_POOL_SIZE:-5}"
      API_SESSION_SIGNING_KEY: "${API_SESSION_SIGNING_KEY:?API_SESSION_SIGNING_KEY is required}"
      OTP_SEALING_KEY_ID: v1
      OTP_SEALING_KEY: "${OTP_SEALING_KEY:?OTP_SEALING_KEY is required}"
      OTP_SEALING_KEYS_JSON: '{"v1":"${OTP_SEALING_KEY:?OTP_SEALING_KEY is required}"}'
      SMS_WEBHOOK_URL: http://stub:3003/sms/deliver
      SMS_WEBHOOK_HEALTH_URL: http://stub:3003/sms/health
      SMS_WEBHOOK_API_KEY: uat-sms-key
      EMAIL_WEBHOOK_URL: http://stub:3003/email/deliver
      EMAIL_WEBHOOK_HEALTH_URL: http://stub:3003/email/health
      EMAIL_WEBHOOK_API_KEY: uat-email-key
      FILE_SCAN_WEBHOOK_URL: http://stub:3003/scan/deliver
      FILE_SCAN_WEBHOOK_HEALTH_URL: http://stub:3003/scan/health
      FILE_SCAN_WEBHOOK_API_KEY: uat-scan-key
      DOMAIN_REGISTRATION_MODULES: ../composition/supply-writes-manifest.js,../composition/operations-writes-manifest.js
      LOCAL_FILE_STORAGE_ROOT: /var/lib/topology-files
    expose:
      - "3001"
    depends_on:
      stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - "${PROJECT_ROOT:-/opt/topology-scm-v2}/data/files:/var/lib/topology-files"
      - "${PROJECT_ROOT:-/opt/topology-scm-v2}/source:/workspace/source:ro"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  app:
    image: "${WEB_IMAGE:?WEB_IMAGE is required}"
    user: "0:0"
    restart: unless-stopped
    environment:
      APP_BASE_URL: "https://scm.topologygz.com"
      APP_ENV: local
      DEPLOY_TARGET: local
      NODE_ENV: test
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - "${PROJECT_ROOT:-/opt/topology-scm-v2}/source:/workspace/source:ro"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  nginx:
    # Official nginx:1.27-alpine mirrored to ACR because this ECS cannot reliably reach Docker Hub.
    image: registry.cn-guangzhou.aliyuncs.com/bigdata200/my-opc-workbench:topology-scm-nginx-1.27-alpine
    user: "0:0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx-uat.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
