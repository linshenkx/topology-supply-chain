services:
  app:
    container_name: topology-scm-app
    build:
      context: ../..
      dockerfile: Dockerfile.aliyun
      target: runner
    image: topology-scm:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_BASE_URL: "${APP_BASE_URL:-}"
      APP_ENV: production
      SESSION_SECRET: "${SESSION_SECRET:-}"
      API_SESSION_SIGNING_KEY: "${API_SESSION_SIGNING_KEY:-}"
      JOB_TOKEN: "${JOB_TOKEN:-}"
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      DB_SSL: "${DB_SSL:-enabled}"
      DB_SSL_REJECT_UNAUTHORIZED: "${DB_SSL_REJECT_UNAUTHORIZED:-true}"
      OSS_REGION: "${OSS_REGION:-}"
      OSS_BUCKET: "${OSS_BUCKET:-}"
      OSS_ECS_RAM_ROLE: "${OSS_ECS_RAM_ROLE:-}"
      OSS_INTERNAL_ENDPOINT: "${OSS_INTERNAL_ENDPOINT:-true}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      SMS_ECS_RAM_ROLE: "${SMS_ECS_RAM_ROLE:-}"
      SMS_REGION_ID: "${SMS_REGION_ID:-cn-hangzhou}"
      ALIYUN_SMS_SIGN_NAME: "${ALIYUN_SMS_SIGN_NAME:-}"
      ALIYUN_SMS_TEMPLATE_CODE: "${ALIYUN_SMS_TEMPLATE_CODE:-}"
      SMS_WEBHOOK_URL: "${SMS_WEBHOOK_URL:-}"
      SMS_WEBHOOK_API_KEY: "${SMS_WEBHOOK_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEPLOY_TARGET: aliyun
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "10"

  api:
    container_name: topology-scm-api
    build:
      context: ../..
      dockerfile: Dockerfile.api
      target: runner
    image: topology-scm-api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      DATABASE_URL: "${DATABASE_URL:-}"
      API_SESSION_SIGNING_KEY: "${API_SESSION_SIGNING_KEY:-}"
      OTP_SEALING_KEY_ID: "${OTP_SEALING_KEY_ID:-}"
      OTP_SEALING_KEY: "${OTP_SEALING_KEY:-}"
      DOMAIN_REGISTRATION_MODULES: "../modules/r2-master-procurement/index.js,../r3/manifest.js"
      WORKER_INTERNAL_URL: "http://worker:3002"
      DB_TRANSACTION_TIMEOUT_MS: "${DB_TRANSACTION_TIMEOUT_MS:-30000}"
      DB_CONNECT_TIMEOUT_MS: "${DB_CONNECT_TIMEOUT_MS:-5000}"
      DB_PING_TIMEOUT_MS: "${DB_PING_TIMEOUT_MS:-2000}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      DB_QUERY_TIMEOUT_MS: "${DB_QUERY_TIMEOUT_MS:-5000}"
      DB_SSL: "${DB_SSL:-enabled}"
      DB_SSL_REJECT_UNAUTHORIZED: "${DB_SSL_REJECT_UNAUTHORIZED:-true}"
      OSS_REGION: "${OSS_REGION:-}"
      OSS_BUCKET: "${OSS_BUCKET:-}"
      OSS_ECS_RAM_ROLE: "${OSS_ECS_RAM_ROLE:-}"
      OSS_INTERNAL_ENDPOINT: "${OSS_INTERNAL_ENDPOINT:-true}"
      OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
      OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
      DEPLOY_TARGET: aliyun
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "10"

  worker:
    container_name: topology-scm-worker
    build:
      context: ../..
      dockerfile: Dockerfile.worker
      target: runner
    image: topology-scm-worker:${WORKER_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      DB_SSL: "${DB_SSL:-enabled}"
      DB_SSL_REJECT_UNAUTHORIZED: "${DB_SSL_REJECT_UNAUTHORIZED:-true}"
      WORKER_DB_POOL_SIZE: "${WORKER_DB_POOL_SIZE:-5}"
      SMS_WEBHOOK_URL: "${SMS_WEBHOOK_URL:-}"
      SMS_WEBHOOK_API_KEY: "${SMS_WEBHOOK_API_KEY:-}"
      SMS_WEBHOOK_HEALTH_URL: "${SMS_WEBHOOK_HEALTH_URL:-}"
      EMAIL_WEBHOOK_URL: "${EMAIL_WEBHOOK_URL:-}"
      EMAIL_WEBHOOK_API_KEY: "${EMAIL_WEBHOOK_API_KEY:-}"
      EMAIL_WEBHOOK_HEALTH_URL: "${EMAIL_WEBHOOK_HEALTH_URL:-}"
      FILE_SCAN_WEBHOOK_URL: "${FILE_SCAN_WEBHOOK_URL:-}"
      FILE_SCAN_WEBHOOK_API_KEY: "${FILE_SCAN_WEBHOOK_API_KEY:-}"
      FILE_SCAN_WEBHOOK_HEALTH_URL: "${FILE_SCAN_WEBHOOK_HEALTH_URL:-}"
      OTP_SEALING_KEYS_JSON: '${OTP_SEALING_KEYS_JSON:-}'
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3002"
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "10"

  migrator:
    build:
      context: ../..
      dockerfile: Dockerfile.aliyun
      target: migrator
    image: topology-scm-migrator:${APP_IMAGE_TAG:-latest}
    profiles: ["migration"]
    env_file:
      - .env.production
    environment:
      DEPLOY_TARGET: aliyun
      NODE_ENV: production
    command: ["pnpm", "db:migrate:mysql"]
