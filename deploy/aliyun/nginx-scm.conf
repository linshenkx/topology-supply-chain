limit_req_zone $binary_remote_addr zone=topology_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name scm.topologygz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scm.topologygz.com;

    ssl_certificate /etc/nginx/ssl/scm.topologygz.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/scm.topologygz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location = /api/v1 {
        return 308 /api/v1/;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /api/auth/login {
        limit_req zone=topology_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
